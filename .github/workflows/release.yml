name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            TAG="$PKG"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json $PKG"
            exit 1
          fi

  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build release files
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Upload Windows files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/StreamPanel-*-Setup.exe
            dist/StreamPanel-*-Setup.exe.blockmap
            dist/latest.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Verify and publish all release files
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            TAG="v$VERSION"
            REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk '{print $1}')
            if [ -z "$REMOTE_SHA" ]; then
              REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
            fi
            if [ -z "$REMOTE_SHA" ]; then
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "$TAG"
            elif [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already points to $REMOTE_SHA, not $GITHUB_SHA"
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ASSETS=(
            "release-assets/StreamPanel-$VERSION-Setup.exe"
            "release-assets/StreamPanel-$VERSION-Setup.exe.blockmap"
            "release-assets/latest.yml"
          )
          for ASSET in "${ASSETS[@]}"; do
            test -f "$ASSET" || { echo "::error::Missing release file: $ASSET"; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$VERSION" --generate-notes --verify-tag
          fi
          PUBLISHED=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for ASSET in "${ASSETS[@]}"; do
            NAME=$(basename "$ASSET")
            grep -Fxq "$NAME" <<<"$PUBLISHED" || {
              echo "::error::Missing published release file: $NAME"
              exit 1
            }
          done

  mirror:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/download-mirror.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
