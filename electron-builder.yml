appId: com.deepsky616.streampanel
productName: Stream Panel
copyright: Copyright © 2026 deepsky616
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: StreamPanel-${version}-Setup.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  artifactName: StreamPanel-${version}-${arch}.${ext}
  extendInfo:
    LSUIElement: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Stream Panel
  deleteAppDataOnUninstall: false
  installerLanguages: [ko-KR, en-US]
  language: "1042"
publish:
  provider: github
  owner: deepsky616
  repo: stream-panel
  releaseType: release
