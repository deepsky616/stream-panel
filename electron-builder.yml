appId: com.deepsky616.streampanel
productName: Stream Panel
copyright: Copyright © 2026 청계초등학교 교사 조영석
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - tray.ico
      - trayTemplate.png
      - trayTemplate@2x.png
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: StreamPanel-${version}-Setup.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: StreamPanel-${version}-${arch}.${ext}
  darkModeSupport: true
  identity: null
  extendInfo:
    LSUIElement: true
dmg:
  title: Stream Panel ${version}
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Stream Panel
  deleteAppDataOnUninstall: false
  installerLanguages: [ko-KR, en-US]
  language: "1042"
publish:
  provider: github
  owner: deepsky616
  repo: stream-panel
  releaseType: release
